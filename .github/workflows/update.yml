name: Update PKGBUILDs

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update-packages:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git jq nvchecker pacman-contrib

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "*"
          
          # makepkg maliciously overrides GIT_CONFIG_SYSTEM to point to this directory
          # and points GIT_CONFIG_GLOBAL to /dev/null to intentionally blind Git.
          # We must inject our safe.directory directly into makepkg's secret config file!
          mkdir -p /etc/makepkg.d
          echo -e "[safe]\n\tdirectory = *" > /etc/makepkg.d/gitconfig

      - name: Check and Update Packages
        run: |
          # Patch makepkg to allow running as root in this disposable CI container
          sed -i 's/EUID == 0/EUID == -1/' /usr/bin/makepkg
          
          cd $GITHUB_WORKSPACE
          for pkg in */ ; do
            pkg=${pkg%/}
            if [ -f "$pkg/.nvchecker.toml" ]; then
              echo "Checking $pkg..."
              cd "$pkg"
              
              result=$(nvchecker -c .nvchecker.toml --logger json 2>/dev/null | grep '"event": "updated"' || true)
              
              if [ ! -z "$result" ]; then
                new_version=$(echo "$result" | jq -r '.version')
                
                if grep -q 'source = "aur"' .nvchecker.toml; then
                  new_version=${new_version%-*}
                fi
                
                safe_version=${new_version//-/_}
                echo "Updating $pkg to $safe_version"
                
                sed -i "s/^pkgver=.*/pkgver=$safe_version/" PKGBUILD
                sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
                
                updpkgsums
                makepkg --printsrcinfo > .SRCINFO
                
                true_version=$(awk -F ' = ' '/^\s*pkgver =/ {print $2; exit}' .SRCINFO)
                if [ ! -z "$true_version" ]; then
                  sed -i "s/^pkgver=.*/pkgver=$true_version/" PKGBUILD
                  new_version=$true_version
                fi
                
                git add PKGBUILD .SRCINFO
                git commit -m "upg($pkg): update to $new_version" || echo "No changes to commit"
                

              fi
              cd ..
            fi
          done

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Automated Package Updates"
          body: "Automated package updates by nvchecker."
          branch: "auto-updates"
          delete-branch: true
